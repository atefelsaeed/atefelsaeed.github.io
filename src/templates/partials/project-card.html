<div class="card" data-cat="{{c}}">{{#if thumb}}<div class="thumb"><img src="/{{thumb}}" alt="{{n}}" width="540" height="1082" loading="lazy"></div>{{/if}}<div class="card-top"><span class="tag">{{c}}</span><span class="platforms">{{@root.app.strings.platforms}}</span></div><h2>{{#if href}}<a class="card-link" href="{{href}}">{{n}}</a>{{else}}{{n}}{{/if}}</h2><p>{{d}}</p>{{#if m}}<span class="metric">{{m}}</span>{{/if}}{{> partials/project-links}}</div>
