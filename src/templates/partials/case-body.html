<div class="case-body">
  <div class="case-meta"><span class="tag">{{tag}}</span><span class="mono">{{pkg}}</span></div>
  <h3>{{title}}</h3>
  <dl>{{#each summary}}
    <div><dt>{{dt}}</dt><dd>{{dd}}</dd></div>{{/each}}
  </dl>
  <details class="more"><summary>{{moreLabel}}</summary><dl>{{#each more}}
    <div><dt>{{dt}}</dt><dd>{{dd}}</dd></div>{{/each}}
  </dl></details>
  <div class="links">{{#each links}}
    <a href="{{url}}" target="_blank" rel="noopener">{{label}}</a>{{/each}}
  </div>
</div>
