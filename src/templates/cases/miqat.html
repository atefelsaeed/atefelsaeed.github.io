    <article class="case" id="{{id}}">
      {{> partials/case-body}}
      <aside class="panel" aria-label="{{asideLabel}}">
        <div class="shots">{{#each shots}}<img src="/{{src}}" alt="{{alt}}" width="{{w}}" height="{{h}}" loading="lazy">{{/each}}</div>
        <span class="label">{{modulesLabel}}</span>
        <div class="modules">{{#each modules}}
          <div class="module">{{t}}<small>{{d}}</small></div>{{/each}}
        </div>
      </aside>
    </article>
