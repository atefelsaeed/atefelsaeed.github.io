<!doctype html>
<html lang="{{page.code}}" dir="{{page.dir}}">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("ae-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{meta.ogTitle}}">
<meta property="og:description" content="{{meta.ogDescription}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:image" content="{{site.origin}}/{{files.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{#if meta.ogLocale}}<meta property="og:locale" content="{{meta.ogLocale}}">{{/if}}
<script type="application/ld+json">{{@json person}}</script>
<link rel="canonical" href="{{page.url}}">{{#each pages}}
<link rel="alternate" hreflang="{{code}}" href="{{url}}">{{/each}}
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{meta.fonts}}">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#about">{{ui.skip}}</a>
<div class="progress" id="progress" aria-hidden="true"></div>

{{> partials/nav}}

<main class="wrap" id="top">
{{> sections/hero}}
{{> sections/about}}
{{> sections/services}}
{{> sections/experience}}
{{> sections/work}}
{{> sections/skills}}
{{> sections/blog}}
{{> sections/contact}}
</main>

{{> partials/footer}}

<button class="to-top" id="toTop" type="button" aria-label="{{ui.toTopLabel}}">
  {{svg "arrow-up"}}
</button>
<div class="toast" id="toast" role="status"></div>

<script>window.SITE = {{@json clientData}};</script>
<script src="app.js"></script>
</body>
</html>
