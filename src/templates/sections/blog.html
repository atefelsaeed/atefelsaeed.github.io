  <section id="blog">
    <div class="sec-head reveal">
      <span class="label">{{blog.label}}</span>
      <h2>{{blog.title}}</h2>
      <p>{{blog.intro}}</p>
    </div>
    <div class="posts">{{#each homePosts}}
      {{> partials/post}}{{/each}}
    </div>
    <div style="margin-top:24px" class="reveal"><a class="btn" href="{{page.blogHref}}">{{blog.allLink}}</a></div>
  </section>
