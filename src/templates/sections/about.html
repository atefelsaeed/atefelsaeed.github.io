  <section id="about">
    <div class="sec-head reveal">
      <span class="label">{{about.label}}</span>
      <h2>{{about.title}}</h2>
    </div>
    <div class="about">
      <div class="portrait reveal">
        <div class="portrait-frame"><img src="{{files.portrait}}" alt="{{about.portraitAlt}}" width="576" height="576" loading="lazy"></div>
        <div class="badge b1"><b>{{about.badges.0.b}}</b><span>{{about.badges.0.s}}</span></div>
        <div class="badge b2"><b>{{about.badges.1.b}}</b><span>{{about.badges.1.s}}</span></div>
      </div>
      <div class="about-main">
        <div class="about-text reveal">{{#each about.paras}}
          <p>{{{this}}}</p>{{/each}}
        </div>
        <div class="highlights">{{#each about.hl}}
          <div class="hl reveal">{{svg icon}}<h3>{{t}}</h3><p>{{d}}</p></div>{{/each}}
        </div>
      </div>
    </div>
  </section>
