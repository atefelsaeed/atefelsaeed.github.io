  <section id="work">
    <div class="sec-head reveal">
      <span class="label">{{work.label}}</span>
      <h2>{{work.title}}</h2>
      <p>{{work.intro}}</p>
    </div>
    <div class="featured">{{#each featured}}
      {{> partials/feature-card}}{{/each}}
    </div>
    <p class="more-link reveal"><a class="btn" href="{{page.projectsHref}}">{{work.allLink}} ({{projects.length}})</a></p>
  </section>
