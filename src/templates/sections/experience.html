  <section id="experience">
    <div class="sec-head reveal">
      <span class="label">{{experience.label}}</span>
      <h2>{{experience.title}}</h2>
      <p>{{experience.intro}}</p>
    </div>
    <div class="timeline">{{#each experience.jobs}}
      {{#if current}}{{> partials/job}}{{else}}{{> partials/job-compact}}{{/if}}{{/each}}
    </div>
    <p class="more-link reveal"><a class="btn" href="{{page.experienceHref}}">{{experience.allLink}}</a></p>
  </section>
